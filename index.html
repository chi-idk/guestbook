<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neocities Guestbook Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="guestbook-container">
    <h2>Sign the Guestbook</h2>
    
    <!-- Guestbook Input Form -->
    <form id="guestbookForm" class="guestbook-form">
      <!-- Flexbox Row for Visitor Info -->
      <div class="guestbook-row">
        <div class="guestbook-field">
          <label for="gbName">Name *</label>
          <input type="text" id="gbName" required placeholder="Your name">
        </div>
        
        <div class="guestbook-field">
          <label for="gbEmail">Email <small>(Confidential)</small></label>
          <input type="email" id="gbEmail" placeholder="For reply notifications">
        </div>
        
        <div class="guestbook-field">
          <label for="gbWebsite">Website URL</label>
          <input type="url" id="gbWebsite" placeholder="https://yoursite.com">
        </div>
      </div>

      <div class="guestbook-field full-width">
        <label for="gbMessage">Message *</label>
        <textarea id="gbMessage" required placeholder="Leave a nice note for the site owner..."></textarea>
      </div>

      <div class="guestbook-form-footer">
        <!-- Admin Login Toggle / Trigger -->
        <button type="button" id="adminToggleBtn" class="admin-toggle-link">Admin Login</button>
        <button type="submit" class="guestbook-submit-btn">Post Message</button>
      </div>
    </form>

    <!-- Admin Login Modal / Section (Hidden by default) -->
    <div id="adminLoginSection" class="admin-login-section" style="display: none;">
      <h4>Admin Authentication</h4>
      <input type="password" id="adminPasswordInput" placeholder="Enter super-secret admin password">
      <button type="button" id="adminLoginSubmit">Login as Admin</button>
    </div>

    <!-- Message Feed -->
    <div id="guestbookMessages" class="guestbook-messages">
      <!-- Dynamic messages will load here -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
